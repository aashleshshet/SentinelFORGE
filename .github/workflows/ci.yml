name: Validate SentinelForge
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sentinelforge_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: test-only-ci-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinelforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check backend tests scripts
      - run: ruff format --check backend tests scripts
      - run: pytest --cov=sentinelforge --cov-fail-under=85 --cov-report=xml
      - name: Verify PostgreSQL contracts
        env:
          SF_TEST_DATABASE_URL: postgresql+psycopg://sentinel:test-only-ci-password@localhost:5432/sentinelforge_test
        run: pytest -q
      - run: python scripts/evaluate.py --output /tmp/evaluation.json
      - run: python scripts/benchmark.py --events 1000 --output /tmp/benchmark.json
      - run: pip-audit -r requirements.lock
      - uses: actions/upload-artifact@v4
        with:
          name: backend-validation
          path: |
            coverage.xml
            /tmp/evaluation.json
            /tmp/benchmark.json
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run build
      - run: pnpm --dir frontend audit --audit-level high
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: python scripts/setup.py
      - name: Start real API with compiled frontend
        run: |
          python -m uvicorn sentinelforge.main:app --host 127.0.0.1 --port 8000 --no-access-log > /tmp/sentinelforge.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8000/api/health && break; sleep 1; done
      - run: pnpm --dir frontend exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: |
            docs/screenshots/
            frontend/test-results/
            /tmp/sentinelforge.log
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/setup.py
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait
      - run: curl --fail http://127.0.0.1:8000/api/health
      - name: Exercise PostgreSQL deployment
        run: python scripts/smoke.py
      - run: docker compose down --volumes
        if: always()
