name: Validate SentinelForge
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sentinelforge_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: test-only-ci-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinelforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check backend tests scripts
      - run: ruff format --check backend tests scripts
      - run: pytest --cov=sentinelforge --cov-fail-under=85 --cov-report=xml
      - name: Verify PostgreSQL contracts
        env:
          SF_TEST_DATABASE_URL: postgresql+psycopg://sentinel:test-only-ci-password@localhost:5432/sentinelforge_test
        run: pytest -q
      - name: Verify frozen inputs and generated rules
        run: |
          python scripts/build_evaluation_corpus.py --check
          python scripts/build_fixtures.py
          python scripts/build_public_demo.py --check
          git diff --exit-code -- rules data
      - name: Evaluate legacy and expanded regressions
        run: |
          python scripts/evaluate.py --output /tmp/detection/legacy.json
          python scripts/evaluate.py --dataset data/evaluation-v2/development.json --output /tmp/detection/development.json
          python scripts/evaluate.py --dataset data/evaluation-v2/validation.json --output /tmp/detection/validation.json
          set +e
          python scripts/evaluate.py --require-targets --output /tmp/detection/legacy-targets.json
          legacy_exit=$?
          python scripts/evaluate.py --dataset data/evaluation-v2/robustness.json --output /tmp/detection/robustness.json
          robustness_exit=$?
          set -e
          test "$legacy_exit" -eq 1
          test "$robustness_exit" -eq 2
      - run: python scripts/benchmark.py --events 1000 --runs 3 --output /tmp/benchmark.json
      - run: pip-audit -r requirements.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-validation
          path: |
            coverage.xml
            /tmp/detection/
            /tmp/benchmark.json
  detection-targets:
    # A separate, deliberately blocking point-estimate gate. Unmet targets remain red in the draft PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python scripts/build_evaluation_corpus.py --check
      - name: Strict targets on the declared frozen acceptance dataset
        run: python scripts/evaluate.py --dataset data/evaluation-v2/holdout.json --require-targets --output /tmp/holdout-targets.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detection-targets
          path: |
            /tmp/holdout-targets.json
            data/evaluation-v2/manifest.json
            data/evaluation-v2/leakage-audit.json
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run build
      - run: pnpm --dir frontend audit --audit-level high
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: python scripts/setup.py
      - name: Start real API with compiled frontend
        run: |
          python -m uvicorn sentinelforge.main:app --host 127.0.0.1 --port 8000 --no-access-log > /tmp/sentinelforge.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8000/api/health && break; sleep 1; done
      - run: pnpm --dir frontend exec playwright test
      - name: Test public demo, guide and accessibility
        env:
          SF_PUBLIC_DEMO: '1'
          SF_BASE_URL: http://127.0.0.1:8002
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8002 --no-access-log > /tmp/sentinelforge-public.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8002/api/health && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8002/api/health
          pnpm --dir frontend exec playwright test public-demo.spec.ts modernization.spec.ts ux-hardening.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: |
            docs/screenshots/
            frontend/test-results/
            /tmp/sentinelforge.log
            /tmp/sentinelforge-public.log
            work/modernization/
            work/ux-hardening/
            work/vercel-screenshots/
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/setup.py
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait
      - run: curl --fail http://127.0.0.1:8000/api/health
      - name: Exercise PostgreSQL deployment
        run: python scripts/smoke.py
      - name: Capture gateway startup diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100 gateway
      - run: docker compose down --volumes
        if: always()
