name: sentinelforge
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentinelforge
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/setup.py first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sentinel -d sentinelforge']
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
    networks: [private]
    restart: unless-stopped
  api:
    build: .
    environment:
      SF_IDENTITIES: ${SF_IDENTITIES:?Run python scripts/setup.py first}
      SF_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinelforge
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp:size=32M,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    networks: [private]
    restart: unless-stopped
  gateway:
    image: nginx:stable-alpine
    user: '101:101'
    entrypoint: [nginx]
    command: [-g, 'daemon off;']
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    ports: ['127.0.0.1:8000:8080']
    read_only: true
    tmpfs: ['/tmp:size=16M,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 64m
    networks: [private, edge]
    restart: unless-stopped
volumes:
  database:
networks:
  private:
    internal: true
  edge: {}
