        <h1>What is SentinelForge?</h1>
        <p>
          SentinelForge is a defensive engineering lab that turns supported
          security logs into explainable alerts, incident investigations and
          preserved evidence. Its public demo is a read-only synthetic snapshot;
          its local workspace supports importing telemetry and documenting
          analyst decisions.
        </p>
        <p>
          Nine experimental rules and six source adapters demonstrate a bounded
          workflow. Response actions are simulations only. Detection acceptance
          targets remain unmet; this is not a production SOC service.
